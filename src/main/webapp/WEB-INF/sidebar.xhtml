<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:p="http://primefaces.org/ui">

    <div class="layout-sidebar">
        <div class="layout-sidebar-logo">            
            <a href="#" id="layout-sidebar-anchor" class="layout-sidebar-anchor" title="Toggle Menu">
                <i class="pi"/>
            </a>
        </div>

        <div class="layout-menu-container">
            <h:form id="menuform">
                <ul class="layout-menu">
                    <li>
                        <h:link outcome="/index.xhtml">
                            <i class="layout-menuitem-icon pi pi-fw pi-home"/>
                            <span>Catálogo</span>
                        </h:link>
                    </li>
                    <ui:fragment rendered="#{loginController.logado}">
                        <li>
                            <h:link outcome="/admin/painel.xhtml">
                                <i class="layout-menuitem-icon pi pi-fw pi-th-large"/>
                                <span>Painel</span>
                            </h:link>
                        </li>
                        <li>
                            <h:link outcome="/admin/prancha.xhtml">
                                <i class="layout-menuitem-icon pi pi-fw pi-image"/>
                                <span>Pranchas</span>
                            </h:link>
                        </li>
                        <li>
                            <h:link outcome="/admin/marca.xhtml">
                                <i class="layout-menuitem-icon pi pi-fw pi-tag"/>
                                <span>Marcas</span>
                            </h:link>
                        </li>
                        <li>
                            <h:link outcome="/admin/construcao.xhtml">
                                <i class="layout-menuitem-icon pi pi-fw pi-box"/>
                                <span>Construções</span>
                            </h:link>
                        </li>
                        <li>
                            <h:link outcome="/admin/quilha.xhtml">
                                <i class="layout-menuitem-icon pi pi-fw pi-sliders-h"/>
                                <span>Quilhas</span>
                            </h:link>
                        </li>
                        <li>
                            <h:link outcome="/admin/pintura.xhtml">
                                <i class="layout-menuitem-icon pi pi-fw pi-palette"/>
                                <span>Pinturas</span>
                            </h:link>
                        </li>
                        <ui:fragment rendered="#{loginController.admin}">
                            <li>
                                <h:link outcome="/admin/usuario.xhtml">
                                    <i class="layout-menuitem-icon pi pi-fw pi-users"/>
                                    <span>Usuários</span>
                                </h:link>
                            </li>
                        </ui:fragment>
                        <li>
                            <h:commandLink action="#{loginController.logout}">
                                <i class="layout-menuitem-icon pi pi-fw pi-sign-out"/>
                                <span>Sair</span>
                            </h:commandLink>
                        </li>
                    </ui:fragment>
                    <ui:fragment rendered="#{not loginController.logado}">
                        <li>
                            <h:link outcome="/login.xhtml">
                                <i class="layout-menuitem-icon pi pi-fw pi-sign-in"/>
                                <span>Login</span>
                            </h:link>
                        </li>
                    </ui:fragment>
                </ul>
            </h:form>
        </div>
    </div>

</ui:composition>
