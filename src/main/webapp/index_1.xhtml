<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
    <h:head>
        <title>Facelet Title</title>
    </h:head>
    <h:body>
        <h:form id="frmList">
            <h:panelGroup id="pngList">
                <p:growl id="growl" showDetail="true"/>
                <p:fieldset toggleable="true">
                    <p:dataTable 
                        id="datalist" 
                        value="#{pessoaController.pessoaList}" 
                        selectionMode="single" selection="#{pessoaController.selected}"
                        widgetVar="datalistPessoaWidgetVar"
                        rowKey="#{item.id}"
                        var="item"
                        paginator="true"
                        rows="3"
                        rowsPerPageTemplate="5,10,50,100"
                        emptyMessage="Nenhuma pessoa cadastrada..."
                    >
                        <p:ajax event="rowSelect" update="btnEdit btnDelete"/>
                        <p:ajax event="rowUnselect" update="btnEdit btnDelete"/>
                        
                        <p:column width="4%" sortBy="#{item.id}" filterBy="#{item.id}">
                            <f:facet name="header">
                                <h:outputText value="ID"/>
                            </f:facet>
                            <h:outputText value="#{item.id}"/>
                        </p:column>
                        
                        <p:column width="4%" sortBy="#{item.nome}" filterBy="#{item.nome}">
                            <f:facet name="header">
                                <h:outputText value="Nome"/>
                            </f:facet>
                            <h:outputText value="#{item.nome}" />
                        </p:column>
                        
                        <p:column width="6%" sortBy="#{item.dataNascimento}" filterBy="#{item.dataNascimento}">
                            <f:facet name="header">
                                <h:outputText value="Dt Nascimento"/>
                            </f:facet>
                            <h:outputText value="#{item.dataNascimento}">
                                <f:convertDateTime pattern="dd/MM/yyyy" />
                            </h:outputText>
                        </p:column>
                        
                        <p:column width="8%" sortBy="#{item.email}" filterBy="#{item.email}">
                            <f:facet name="header">
                                <h:outputText value="Email"/>
                            </f:facet>    
                            <h:outputText value="#{item.email}"/>
                        </p:column>
                        
                        <p:column width="5%" sortBy="#{item.fumante}" filterBy="#{item.fumante}">
                            <f:facet name="header">
                                <h:outputText value="Fumante"/>
                            </f:facet>    
                            <h:outputText value="#{item.fumante}"/>
                        </p:column>
                        
                        <p:column width="3%" sortBy="#{item.idade}" filterBy="#{item.idade}">
                            <f:facet name="header">
                                <h:outputText value="Idade"/>
                            </f:facet>    
                            <h:outputText value="#{item.idade}"/>
                        </p:column>
                        
                        <p:column width="5%" sortBy="#{item.cidadania}" filterBy="#{item.cidadania}">
                            <f:facet name="header">
                                <h:outputText value="Cidadania"/>
                            </f:facet>    
                            <h:outputText value="#{item.cidadania}"/>
                        </p:column>
                        
                        <p:column width="8%" sortBy="#{item.observacao}" filterBy="#{item.observacao}">
                            <f:facet name="header">
                                <h:outputText value="Observação"/>
                            </f:facet>    
                            <h:outputText value="#{item.observacao}"/>
                        </p:column>
                        
                        <f:facet name="footer">
                            <p:commandButton id="btnCreate" 
                                             value="Incluir Pessoa" 
                                             icon="pi pi-external-link" 
                                             onclick="PF('dlgCreate').show()"
                            />    
                            <p:spacer/>
                            <p:commandButton id="btnEdit" 
                                             value="Editar Pessoa" 
                                             icon="pi pi-user-edit" 
                                             update="formEdit"
                                             oncomplete="PF('dlgEdit').show()"
                                             disabled="#{empty pessoaController.selected}"
                            />  
                            <p:commandButton id="btnDelete" 
                                             value="Deletar Pessoa" 
                                             icon="pi pi-trash" 
                                             update="frmList"
                                             actionListener="#{pessoaController.deletarPessoa()}"
                                             disabled="#{empty pessoaController.selected}"
                            >
                                <p:confirm header="Confirmar exclusão" message="Vai excluir mesmo?" icon="ui-icon-alert" />
                            </p:commandButton> 
                    </f:facet>
                    </p:dataTable>
                </p:fieldset>
                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                    <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="fa fa-check"/>
                    <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no" icon="fa fa-times"/>
                </p:confirmDialog>
            </h:panelGroup>
        </h:form>
        
        <p:dialog header="Nova Pessoa" widgetVar="dlgCreate" height="400" width="600" showEffect="fade" modal="true">
            <h:form id="CreateForm">
                <p:growl id="growl" showDetail="true"/>
                <h:panelGrid id="pngCadastro" columns="2">
                    <p:outputLabel id="oplNome" value="Nome:" for="iptNome"/>
                    <p:inputText id="iptNome" size="40" label="Nome" required="true"
                                 requiredMessage="O atributo nome é obrigatório"
                                 value="#{pessoaController.pessoa.nome}" maxlength="50"
                    />
                    
                    <p:outputLabel id="oplDataNascimento" for="ipmDataNascimento" value="Data de Nascimento" />
                    <p:inputMask id="ipmDataNascimento" value="#{pessoaController.pessoa.dataNascimento}"
                                 mask="99/99/9999" required="true" requiredMessage="Data de Nascimento é obrigatório">
                        <f:convertDateTime pattern="dd/MM/yyyy" timeZone="America/Sao_Paulo"/>
                    </p:inputMask>
                    
                    <p:outputLabel id="oplEmail" value="Email:" for="iptEmail"/>
                    <p:inputText id="iptEmail" size="40" label="Email" required="true"
                                 requiredMessage="Email é obrigatório" validatorMessage="Preenchimento inválido"
                                 value="#{pessoaController.pessoa.email}"
                    >
                        <f:validateRegex pattern="[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})"/>
                    </p:inputText>
                    
                    <p:outputLabel id="oplIdade" value="Idade (anos):" for="iptIdade"/>
                    <p:inputNumber id="iptIdade" required="true"
                                 requiredMessage="O atributo nome é obrigatório"
                                 value="#{pessoaController.pessoa.idade}" 
                                 minValue="1"
                                 decimalPlaces="0"
                    />
                   
                    <p:outputLabel id="oplEfumante" value="É fumante?:" for="sbbEfumante"/>
                    <p:selectBooleanButton id="sbbEfumante" onIcon="pi pi-check" offIcon="pi pi-times"
                                 value="#{pessoaController.pessoa.fumante}" 
                    />
                    
                    <p:outputLabel id="oplCidadania" value="Cidadania:" for="somCidadania"/>
                    <p:selectOneMenu id="somCidadania" value="#{pessoaController.pessoa.cidadania}">
                        <f:selectItem itemLabel="Selecione uma opção" itemValue=""/>                        
                        <f:selectItem itemLabel="Brasileiro" itemValue="brasileiro"/>
                        <f:selectItem itemLabel="Argentino" itemValue="argentino"/>
                        <f:selectItem itemLabel="Uruguaio" itemValue="uruguaio"/>
                    </p:selectOneMenu>
                    
                    <p:outputLabel id="oplObservacao" value="Observação:" for="iptaObservacao"/>
                    <p:inputTextarea id="iptaObservacao" rows="4" cols="40" autoResize="false"
                                 value="#{pessoaController.pessoa.observacao}"
                    />
                    
                </h:panelGrid>
                
                <p:commandButton id="btnCadastrar" value="Cadastrar"
                                 update="@form, frmList"
                                 action="#{pessoaController.adicionarPessoa()}"
                                 onclick="dlgCreate.hide()"
                />
                
            </h:form>
        </p:dialog>
        
        <p:dialog header="Editar Pessoa" widgetVar="dlgEdit" height="400" width="600" showEffect="fade" modal="true">
            <h:form id="formEdit">
                <p:growl id="growl" showDetail="true"/>
                <h:panelGrid id="pngEdicao" columns="2">
                    <p:outputLabel id="oplId" value="Nome:" for="iptId"/>
                    <p:inputText id="iptId" size="40" label="Nome" disabled="true"
                                 value="#{pessoaController.selected.id}"
                    />
                    
                    <p:outputLabel id="oplNome" value="Nome:" for="iptNome"/>
                    <p:inputText id="iptNome" size="40" label="Nome" required="true"
                                 requiredMessage="O atributo nome é obrigatório"
                                 value="#{pessoaController.selected.nome}" maxlength="50"
                    />
                    
                    <p:outputLabel id="oplDataNascimento" for="ipmDataNascimento" value="Data de Nascimento" />
                    <p:inputMask id="ipmDataNascimento" value="#{pessoaController.selected.dataNascimento}"
                                 mask="99/99/9999" required="true" requiredMessage="Data de Nascimento é obrigatório">
                        <f:convertDateTime pattern="dd/MM/yyyy" timeZone="America/Sao_Paulo"/>
                    </p:inputMask>
                    
                    <p:outputLabel id="oplEmail" value="Email:" for="iptEmail"/>
                    <p:inputText id="iptEmail" size="40" label="Email" required="true"
                                 requiredMessage="Email é obrigatório" validatorMessage="Preenchimento inválido"
                                 value="#{pessoaController.selected.email}"
                    >
                        <f:validateRegex pattern="[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})"/>
                    </p:inputText>
                    
                    <p:outputLabel id="oplIdade" value="Idade (anos):" for="iptIdade"/>
                    <p:inputNumber id="iptIdade" required="true"
                                 requiredMessage="O atributo nome é obrigatório"
                                 value="#{pessoaController.selected.idade}" 
                                 minValue="1"
                                 decimalPlaces="0"
                    />
                   
                    <p:outputLabel id="oplEfumante" value="É fumante?:" for="sbbEfumante"/>
                    <p:selectBooleanButton id="sbbEfumante" onIcon="pi pi-check" offIcon="pi pi-times"
                                 value="#{pessoaController.selected.fumante}" 
                    />
                    
                    <p:outputLabel id="oplCidadania" value="Cidadania:" for="somCidadania"/>
                    <p:selectOneMenu id="somCidadania" value="#{pessoaController.selected.cidadania}">
                        <f:selectItem itemLabel="Selecione uma opção" itemValue=""/>                        
                        <f:selectItem itemLabel="Brasileiro" itemValue="brasileiro"/>
                        <f:selectItem itemLabel="Argentino" itemValue="argentino"/>
                        <f:selectItem itemLabel="Uruguaio" itemValue="uruguaio"/>
                    </p:selectOneMenu>
                    
                    <p:outputLabel id="oplObservacao" value="Observação:" for="iptaObservacao"/>
                    <p:inputTextarea id="iptaObservacao" rows="4" cols="40" autoResize="false"
                                 value="#{pessoaController.selected.observacao}"
                    />
                    
                </h:panelGrid>
                
                <p:commandButton id="btnEditar" value="Salvar edição"
                                 update="@form, frmList"
                                 action="#{pessoaController.editarPessoa()}"
                                 onclick="dlgEdit.hide()"
                />
                
            </h:form>
        </p:dialog>
    </h:body>
</html>
